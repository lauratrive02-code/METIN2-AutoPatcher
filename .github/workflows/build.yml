name: Build METIN2 AutoPatcher

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name METIN2_AutoPatcher autopatcher.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: METIN2_AutoPatcher
          path: dist/METIN2_AutoPatcher.exe
